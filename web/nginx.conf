# nginx config for the containerised front end.
#
# Two jobs:
#   1. Serve the built React app, with SPA fallback and sane cache headers.
#   2. Proxy /api to the NestJS container, so the browser only ever talks to
#      one origin and CORS never enters the picture.

upstream portfolio_api {
    # "api" is the service name in docker-compose.yml; Docker's embedded DNS
    # resolves it. keepalive reuses connections instead of reconnecting per
    # terminal command.
    server api:3000;
    keepalive 16;
}

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------- compression
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      application/xml image/svg+xml font/woff font/woff2;

    # ------------------------------------------------------ security headers
    #
    # CAREFUL: nginx's add_header is NOT additive across levels. A location
    # that declares any add_header of its own silently discards every
    # add_header inherited from the server block. So the locations below that
    # need their own headers repeat these four rather than relying on
    # inheritance, and locations that only need caching use `expires` (a
    # different directive, which does not break inheritance).
    add_header X-Content-Type-Options    "nosniff"            always;
    add_header X-Frame-Options           "SAMEORIGIN"         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # Don't advertise the nginx version.
    server_tokens off;

    # -------------------------------------------------------- container probe
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ------------------------------------------------------------- API proxy
    # Note the trailing URI is preserved: NestJS already serves under /api
    # (app.setGlobalPrefix('api')), so /api/health here maps to /api/health there.
    location /api/ {
        proxy_pass         http://portfolio_api;

        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # The terminal should feel instant; fail fast rather than hang if the
        # API is down, so the front end falls back to its local engine quickly.
        proxy_connect_timeout 3s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;
    }

    # ---------------------------------------------------- hashed build assets
    # Vite fingerprints these filenames, so they can be cached forever.
    # This block sets Cache-Control itself, so it must restate the security
    # headers (see the note above) — nosniff in particular matters most here.
    location /assets/ {
        access_log off;
        # Set max-age via add_header rather than `expires`, so the response
        # carries exactly one Cache-Control header instead of two.
        add_header Cache-Control             "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options    "nosniff"           always;
        add_header X-Frame-Options           "SAMEORIGIN"        always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        try_files  $uri =404;
    }

    location = /favicon.svg {
        access_log off;
        expires    7d;
    }

    # -------------------------------------------------------- SPA entry point
    # index.html must never be cached, or visitors keep loading an old build
    # that references asset filenames which no longer exist.
    #
    # `expires -1` emits `Cache-Control: no-cache` without using add_header,
    # which is what keeps the server-level security headers applying here.
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
